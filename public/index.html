<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>دردشة</title>
<style>
:root{--bg:#f5f6f8;--sf:#fff;--tx:#1d2330;--mu:#6b7385;--ac:#2563eb;--at:#fff;--me:#dbe7ff;--ln:#e2e5ec;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#14171d;--sf:#1d222b;--tx:#e8ebf2;--mu:#8d95a8;--ac:#4f8cff;--at:#0b1020;--me:#26385e;--ln:#2c3340;color-scheme:dark}}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--tx);font-family:"Segoe UI",Tahoma,Arial,sans-serif;overflow:hidden}
#app{height:100%;display:flex}
#side{width:270px;background:var(--sf);border-inline-end:1px solid var(--ln);display:flex;flex-direction:column}
#side h2{margin:0;padding:14px;font-size:16px;border-bottom:1px solid var(--ln);display:flex;justify-content:space-between;align-items:center}
#list{flex:1;overflow-y:auto}
.it{padding:12px 14px;cursor:pointer;border-bottom:1px solid var(--ln);display:flex;gap:8px;align-items:center}
.it.on{background:var(--me)}.it .dot{margin-inline-start:auto;width:9px;height:9px;border-radius:50%;background:var(--ac)}
.av{width:32px;height:32px;border-radius:50%;background:var(--ac);color:var(--at);display:flex;align-items:center;justify-content:center;font-weight:700;flex:none}
#main{flex:1;display:flex;flex-direction:column;min-width:0}
#head{padding:14px;background:var(--sf);border-bottom:1px solid var(--ln);font-weight:700;display:flex;gap:8px;align-items:center}
#back{display:none;background:none;border:0;color:var(--tx);font-size:20px;cursor:pointer}
#msgs{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:8px}
.m{max-width:75%;padding:8px 12px;border-radius:14px;background:var(--sf);border:1px solid var(--ln);white-space:pre-wrap;word-break:break-word}
.m.me{align-self:flex-start;background:var(--me)}.m small{display:block;color:var(--mu);font-size:11px;margin-bottom:2px}
#bar{display:flex;gap:8px;padding:10px;background:var(--sf);border-top:1px solid var(--ln)}
input,button{font:inherit}
#txt{flex:1;padding:10px 14px;border-radius:20px;border:1px solid var(--ln);background:var(--bg);color:var(--tx)}
.btn{padding:10px 18px;border-radius:20px;border:0;background:var(--ac);color:var(--at);cursor:pointer;font-weight:700}
.lnk{background:none;border:0;color:var(--mu);cursor:pointer;font-size:13px}
#auth{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:20px;z-index:5}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:16px;padding:24px;max-width:360px;width:100%;display:flex;flex-direction:column;gap:12px}
.card input{padding:10px 12px;border-radius:10px;border:1px solid var(--ln);background:var(--bg);color:var(--tx)}
.err{color:#d33;font-size:13px;min-height:16px}.empty{margin:auto;color:var(--mu)}
@media (max-width:640px){#side{width:100%}#main{display:none}#app.chat #side{display:none}#app.chat #main{display:flex}#back{display:block}}
</style>
</head>
<body>
<div id="auth" hidden><div class="card">
  <h2 id="atitle" style="margin:0">تسجيل الدخول</h2>
  <input id="u" placeholder="اسم المستخدم" autocomplete="username">
  <input id="p" type="password" placeholder="كلمة المرور" autocomplete="current-password">
  <div class="err" id="err"></div>
  <button class="btn" id="go">دخول</button>
  <button class="lnk" id="sw">ليس لديك حساب؟ أنشئ حساباً</button>
</div></div>
<div id="app">
  <div id="side"><h2><span>💬 المحادثات</span><button class="lnk" id="out">خروج</button></h2><div id="list"></div></div>
  <div id="main">
    <div id="head"><button id="back">→</button><span id="title">اختر محادثة</span></div>
    <div id="msgs"><div class="empty">اختر الغرفة العامة أو مستخدماً لبدء محادثة خاصة</div></div>
    <div id="bar" hidden><input id="txt" maxlength="1000" placeholder="اكتب رسالة…" autocomplete="off"><button class="btn" id="send">إرسال</button></div>
  </div>
</div>
<script>
const $=i=>document.getElementById(i);
let token=localStorage.getItem("token"),me=JSON.parse(localStorage.getItem("me")||"null"),users=[],cur=null,ws=null,reg=false,unread={};
const api=(p,o={})=>fetch(p,{...o,headers:{"Content-Type":"application/json",...(token?{Authorization:"Bearer "+token}:{})}}).then(async r=>{const j=await r.json();if(!r.ok)throw new Error(j.error||"خطأ");return j});
const name=id=>(users.find(u=>u.id===id)||{}).username||"مستخدم";

function showAuth(){$("auth").hidden=false}
$("sw").onclick=()=>{reg=!reg;$("atitle").textContent=reg?"إنشاء حساب":"تسجيل الدخول";$("go").textContent=reg?"تسجيل":"دخول";$("sw").textContent=reg?"لديك حساب؟ سجّل الدخول":"ليس لديك حساب؟ أنشئ حساباً"};
async function submit(){
  try{const r=await api(reg?"/api/register":"/api/login",{method:"POST",body:JSON.stringify({username:$("u").value,password:$("p").value})});
    token=r.token;me=r.user;localStorage.setItem("token",token);localStorage.setItem("me",JSON.stringify(me));$("auth").hidden=true;start()}
  catch(e){$("err").textContent=e.message}
}
$("go").onclick=submit;$("p").onkeydown=e=>{if(e.key==="Enter")submit()};
$("out").onclick=()=>{localStorage.clear();location.reload()};

function renderList(){
  const l=$("list");l.textContent="";
  [{id:0,name:"🌐 الغرفة العامة"},...users.filter(u=>u.id!==me.id).map(u=>({id:u.id,name:u.username}))].forEach(c=>{
    const d=document.createElement("div");d.className="it"+(cur&&cur.id===c.id?" on":"");
    const a=document.createElement("div");a.className="av";a.textContent=c.id?c.name[0].toUpperCase():"#";
    const n=document.createElement("div");n.textContent=c.name;d.append(a,n);
    if(unread[c.id]){const o=document.createElement("span");o.className="dot";d.appendChild(o)}
    d.onclick=()=>openChat(c);l.appendChild(d);
  });
}
function addMsg(m){
  const box=$("msgs");if(box.querySelector(".empty"))box.textContent="";
  const el=document.createElement("div");el.className="m"+(m.sender_id===me.id?" me":"");
  const s=document.createElement("small");s.textContent=m.sender_id===me.id?"أنت":name(m.sender_id);
  const t=document.createElement("span");t.textContent=m.text;el.append(s,t);box.appendChild(el);box.scrollTop=box.scrollHeight;
}
async function openChat(c){
  cur=c;unread[c.id]=0;renderList();
  $("title").textContent=c.id?"محادثة خاصة مع "+c.name:"الغرفة العامة";
  $("bar").hidden=false;$("app").classList.add("chat");
  $("msgs").textContent="";
  (await api("/api/messages?with="+c.id)).forEach(addMsg);
}
function connect(){
  ws=new WebSocket((location.protocol==="https:"?"wss://":"ws://")+location.host+"/ws?token="+token);
  ws.onmessage=async e=>{
    const m=JSON.parse(e.data).message;if(!m)return;
    if(!users.find(u=>u.id===m.sender_id)){users=await api("/api/users")}
    const key=m.receiver_id===null?0:(m.sender_id===me.id?m.receiver_id:m.sender_id);
    if(cur&&cur.id===key)addMsg(m);else{unread[key]=1;renderList()}
  };
  ws.onclose=()=>setTimeout(()=>token&&connect(),2000);
}
function send(){
  const v=$("txt").value.trim();if(!v||!cur||ws.readyState!==1)return;
  ws.send(JSON.stringify({to:cur.id||null,text:v}));$("txt").value="";
}
$("send").onclick=send;$("txt").onkeydown=e=>{if(e.key==="Enter")send()};
$("back").onclick=()=>$("app").classList.remove("chat");
async function start(){
  try{users=await api("/api/users")}catch{localStorage.clear();token=null;return showAuth()}
  renderList();connect();setInterval(async()=>{try{users=await api("/api/users");renderList()}catch{}},30000);
}
token&&me?start():showAuth();
</script>
</body>
</html>
